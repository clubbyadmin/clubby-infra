name: clubby

# Roda no VPS (AWS Lightsail, São Paulo). O front-end fica na Vercel.
#
#   --profile demo   → postgres-demo + api-demo   (dados mock)
#   --profile prod   → api                         (Neon · main)
#   --profile proxy  → caddy (HTTPS para api-demo. e api.)

x-api-build: &api-build
  context: ./clubby-api
  dockerfile: Dockerfile

services:
  postgres-demo:
    image: postgres:16-alpine
    profiles: [demo]
    environment:
      POSTGRES_DB: clubby_demo
      POSTGRES_USER: clubby
      POSTGRES_PASSWORD: ${POSTGRES_DEMO_PASSWORD:-clubby-demo}
    volumes:
      - clubby_demo_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clubby -d clubby_demo"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api-demo:
    build: *api-build
    profiles: [demo]
    depends_on:
      postgres-demo:
        condition: service_healthy
    env_file:
      - ./deploy/.env
    environment:
      APP_ENV: demo
      NODE_ENV: production
      PORT: 3000
      CLUBBY_DOMAIN: ${CLUBBY_DOMAIN:-clubby.com.br}
      CORS_ORIGINS: ${DEMO_CORS_ORIGINS:-}
      DATABASE_URL: postgresql://clubby:${POSTGRES_DEMO_PASSWORD:-clubby-demo}@postgres-demo:5432/clubby_demo?sslmode=disable
      JWT_SECRET: ${JWT_SECRET_DEMO:-clubby-demo-jwt-secret}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-admin123}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-clubby-admin}
      WHATSAPP_MOCK: "true"
      WHATSAPP_SCHEDULER: "false"
      ALLOW_TEST_TOOLS: "true"
    expose:
      - "3000"
    restart: unless-stopped

  api:
    build: *api-build
    profiles: [prod]
    env_file:
      - ./deploy/.env
    environment:
      APP_ENV: production
      NODE_ENV: production
      PORT: 3000
      CLUBBY_DOMAIN: ${CLUBBY_DOMAIN:-clubby.com.br}
      CORS_ORIGINS: ${PROD_CORS_ORIGINS:-}
      DATABASE_URL: ${DATABASE_URL_PROD:-}
      JWT_SECRET: ${JWT_SECRET_PROD:-}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      WHATSAPP_MOCK: "false"
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      WHATSAPP_INBOUND_URL: ${WHATSAPP_INBOUND_URL:-}
    expose:
      - "3000"
    restart: unless-stopped

  evolution-postgres:
    image: postgres:15-alpine
    profiles: [whatsapp]
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD:-clubby-evolution-db}
    volumes:
      - clubby_evolution_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  evolution-redis:
    image: redis:7-alpine
    profiles: [whatsapp]
    command: redis-server --appendonly yes
    volumes:
      - clubby_evolution_redis:/data
    restart: unless-stopped

  evolution-api:
    image: atendai/evolution-api:v2.1.1
    profiles: [whatsapp]
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_started
    environment:
      TZ: America/Sao_Paulo
      SERVER_URL: ${EVOLUTION_SERVER_URL:-https://evolution.clubby.com.br}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-change-me-evolution}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      LANGUAGE: pt
      DEL_INSTANCE: "false"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD:-clubby-evolution-db}@evolution-postgres:5432/evolution?schema=public
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/1
      CACHE_REDIS_PREFIX_KEY: clubby_evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
      CONFIG_SESSION_PHONE_CLIENT: Clubby
      CONFIG_SESSION_PHONE_NAME: Chrome
    volumes:
      - clubby_evolution_instances:/evolution/instances
    expose:
      - "8080"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    profiles: [proxy]
    environment:
      CLUBBY_DOMAIN: ${CLUBBY_DOMAIN:-clubby.com.br}
      CADDY_EMAIL: ${CADDY_EMAIL:-admin@clubby.com.br}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - clubby_caddy_data:/data
      - clubby_caddy_config:/config
    restart: unless-stopped

volumes:
  clubby_demo_pg:
  clubby_caddy_data:
  clubby_caddy_config:
  clubby_evolution_pg:
  clubby_evolution_redis:
  clubby_evolution_instances:
