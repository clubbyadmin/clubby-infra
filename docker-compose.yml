name: clubby

# Roda no VPS (AWS Lightsail, São Paulo). O front-end fica na Vercel.
#
#   --profile demo   → postgres-demo + api-demo   (dados mock)
#   --profile prod   → api                         (Neon · main)
#   --profile proxy  → caddy (HTTPS para api-demo. e api.)

x-api-build: &api-build
  context: ./clubby-api
  dockerfile: Dockerfile

services:
  postgres-demo:
    image: postgres:16-alpine
    profiles: [demo]
    environment:
      POSTGRES_DB: clubby_demo
      POSTGRES_USER: clubby
      POSTGRES_PASSWORD: ${POSTGRES_DEMO_PASSWORD:-clubby-demo}
    volumes:
      - clubby_demo_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clubby -d clubby_demo"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api-demo:
    build: *api-build
    profiles: [demo]
    depends_on:
      postgres-demo:
        condition: service_healthy
    environment:
      APP_ENV: demo
      NODE_ENV: production
      PORT: 3000
      CLUBBY_DOMAIN: ${CLUBBY_DOMAIN:-clubby.com.br}
      CORS_ORIGINS: ${DEMO_CORS_ORIGINS:-}
      DATABASE_URL: postgresql://clubby:${POSTGRES_DEMO_PASSWORD:-clubby-demo}@postgres-demo:5432/clubby_demo?sslmode=disable
      JWT_SECRET: ${JWT_SECRET_DEMO:-clubby-demo-jwt-secret}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-admin123}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-clubby-admin}
      WHATSAPP_MOCK: "true"
      WHATSAPP_SCHEDULER: "false"
      ALLOW_TEST_TOOLS: "true"
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
    expose:
      - "3000"
    restart: unless-stopped

  api:
    build: *api-build
    profiles: [prod]
    environment:
      APP_ENV: production
      NODE_ENV: production
      PORT: 3000
      CLUBBY_DOMAIN: ${CLUBBY_DOMAIN:-clubby.com.br}
      CORS_ORIGINS: ${PROD_CORS_ORIGINS:-}
      DATABASE_URL: ${DATABASE_URL_PROD:-}
      JWT_SECRET: ${JWT_SECRET_PROD:-}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      WHATSAPP_MOCK: "false"
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
    expose:
      - "3000"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    profiles: [proxy]
    environment:
      CLUBBY_DOMAIN: ${CLUBBY_DOMAIN:-clubby.com.br}
      CADDY_EMAIL: ${CADDY_EMAIL:-admin@clubby.com.br}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - clubby_caddy_data:/data
      - clubby_caddy_config:/config
    restart: unless-stopped

volumes:
  clubby_demo_pg:
  clubby_caddy_data:
  clubby_caddy_config:
